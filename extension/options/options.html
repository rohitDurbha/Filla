<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Filla setup</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; color: #1c1c1e; }
    h1 { font-size: 1.3rem; }
    p.note { color: #555; font-size: 0.9rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; font-size: 0.95rem; }
    select { width: 100%; padding: 0.45rem; margin-top: 0.3rem; font-size: 0.95rem; }
    button { margin-top: 1.6rem; padding: 0.6rem 1.4rem; font-size: 1rem; background: #4a4de7;
             color: white; border: none; border-radius: 8px; cursor: pointer; }
    #saved { color: #1a7f37; margin-left: 0.8rem; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Filla one-time profile</h1>
  <p class="note">
    These answers cover the questions US applications ask that never appear on
    a resume. They are stored only in your browser, asked once, and filled the
    same way on every application. Change them here any time.
  </p>

  <label>Gender
    <select id="gender">
      <option value="">Skip this question</option>
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="nonbinary">Non-binary</option>
      <option value="decline">Decline to self-identify</option>
    </select>
  </label>

  <label>Are you Hispanic or Latino?
    <select id="hispanic_latino">
      <option value="">Skip this question</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
      <option value="decline">Decline to self-identify</option>
    </select>
  </label>

  <label>Race
    <select id="race">
      <option value="">Skip this question</option>
      <option value="american_indian">American Indian or Alaska Native</option>
      <option value="asian">Asian</option>
      <option value="black">Black or African American</option>
      <option value="hispanic">Hispanic or Latino</option>
      <option value="pacific_islander">Native Hawaiian or Other Pacific Islander</option>
      <option value="white">White</option>
      <option value="two_or_more">Two or More Races</option>
      <option value="decline">Decline to self-identify</option>
    </select>
  </label>

  <label>Protected veteran status
    <select id="veteran">
      <option value="">Skip this question</option>
      <option value="not_protected">I am not a protected veteran</option>
      <option value="protected">I identify as one or more classes of protected veteran</option>
      <option value="decline">I do not wish to answer</option>
    </select>
  </label>

  <label>Disability status
    <select id="disability">
      <option value="">Skip this question</option>
      <option value="yes">Yes, I have a disability (or previously had one)</option>
      <option value="no">No, I do not have a disability</option>
      <option value="decline">I do not want to answer</option>
    </select>
  </label>

  <label>Are you legally authorized to work in the United States?
    <select id="work_authorized">
      <option value="">Skip this question</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </label>

  <label>Will you now or in the future require sponsorship?
    <select id="requires_sponsorship">
      <option value="">Skip this question</option>
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
  </label>

  <button id="save">Save profile</button><span id="saved"></span>

  <script src="options.js"></script>
</body>
</html>
